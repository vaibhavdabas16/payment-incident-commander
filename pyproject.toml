[project]
name = "payment-incident-commander"
version = "1.0.0"
description = "Autonomous AI operations for payment incidents: detect, investigate, quantify, decide, gate, act, verify."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pic-demo = "pic.demo:main"
pic-eval = "pic.evaluation.harness:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pic*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end lifecycles that generate simulated traffic"]
